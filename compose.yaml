services:
  db:
    image: postgres:16-alpine
    container_name: postgres-db
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: url-shortener-api

    ports:
      - "8080:8080"

    env_file:
      - .env

    depends_on:
      - db

volumes:
  postgres_data: